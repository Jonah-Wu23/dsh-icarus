# The profile supplies Icarus's peer dependency (@deepseek-ai/cordis) at run time,
# so this package never installs peers of its own. Mirrors the desktop profile setting.
packages:
  - .

allowBuilds:
  '@jackwener/opencli': false
  esbuild: true

autoInstallPeers: false

overrides:
  playwright: 1.64.0
  patchright: 1.63.0
